<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11Pay クーポンQR作成ツール</title>
<!-- HTMLを画像化するライブラリ (html2canvas) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background: #f4f6f9; margin: 0; }
.card { max-width: 420px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h2 { color: #ff0033; margin-bottom: 20px; }
label { display: block; text-align: left; font-weight: bold; font-size: 14px; margin-top: 12px; color: #333; }
input { width: 100%; padding: 12px; font-size: 15px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-top: 5px; }
button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #fff; background: #ff0033; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; }
button:hover { background: #d6002b; }

/* 履歴エリア */
.history-title { margin-top: 35px; border-top: 2px dashed #eee; padding-top: 20px; text-align: left; font-weight: bold; font-size: 16px; color: #333; }
.coupon-item { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-top: 10px; text-align: left; position: relative; }
.coupon-info { font-weight: bold; color: #333; font-size: 14px; }
.coupon-detail { font-size: 12px; color: #666; margin-top: 4px; }
.btn-group { margin-top: 8px; display: flex; gap: 8px; }
.btn-sm { padding: 6px 12px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
.btn-show { background: #28a745; color: #fff; }
.btn-del { background: #6c757d; color: #fff; }

/* モーダル表示 (QR拡大表示用) */
.modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content: center; align-items: center; }
.modal-content { background:#fff; padding:20px; border-radius:16px; max-width:260px; text-align:center; }

/* 共有ボタン用スタイル */
.btn-share { background: #00b894; color: #fff; margin-top: 10px; }
.btn-share:hover { background: #019875; }
</style>
</head>
<body>

<div class="card">
<h2>🎟️ クーポンQR作成</h2>

<label>クーポン名</label>
<input type="text" id="coupon-title" placeholder="例: カフェ 200円OFF">

<label>割引額 (円)</label>
<input type="number" id="coupon-discount" placeholder="例: 200">

<label>最低利用金額 (円)</label>
<input type="number" id="coupon-min" placeholder="例: 500">

<label>有効期限（任意）</label>
<input type="date" id="coupon-expire">

<button onclick="createCoupon()">保存してQRコードを発行</button>

<div class="history-title">📦 作成済みクーポン一覧</div>
<div id="coupon-list"></div>
</div>

<!-- QRポップアップ画面 -->
<div id="qr-modal" class="modal" onclick="closeModal()">
<div class="modal-content" onclick="event.stopPropagation()">
<!-- 画像化対象のコンテナ（コンパクトサイズ） -->
<div id="qr-capture-area" style="background: #fff; padding: 10px; border-radius: 8px;">
<h3 id="modal-title" style="margin-top:0; color:#333; font-size:15px;"></h3>
<div id="modal-qr"></div>
</div>
<p style="font-size:11px; color:#666; margin-top:8px;">11Payのカメラで読み取ってください</p>

<!-- 共有ボタン -->
<button class="btn-sm btn-share" style="width:100%; padding:9px; font-size:13px;" onclick="shareCouponImage()">📤 このQRを共有する</button>

<button onclick="closeModal()" style="margin-top:8px; padding:7px; width:100%; background:#666; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">閉じる</button>
</div>
</div>

<script>
let savedCoupons = JSON.parse(localStorage.getItem('maker_coupons') || '[]');

window.onload = renderList;

function createCoupon() {
const title = document.getElementById("coupon-title").value.trim();
const discount = document.getElementById("coupon-discount").value;
const minPay = document.getElementById("coupon-min").value;
const expire = document.getElementById("coupon-expire").value;

if (!title || !discount || !minPay) {
alert("「有効期限」以外のすべての項目を入力してください！");
return;
}

const newCoupon = {
id: Date.now(),
title: title,
discount: discount,
minPay: minPay,
expire: expire || ""
};

savedCoupons.unshift(newCoupon);
saveAndRender();

document.getElementById("coupon-title").value = '';
document.getElementById("coupon-discount").value = '';
document.getElementById("coupon-min").value = '';
document.getElementById("coupon-expire").value = '';

showQr(newCoupon.id);
}

function deleteCoupon(id) {
if (confirm("このクーポンを削除しますか？")) {
savedCoupons = savedCoupons.filter(c => c.id !== id);
saveAndRender();
}
}

function showQr(id) {
const coupon = savedCoupons.find(c => c.id === id);
if (!coupon) return;

const expireStr = coupon.expire ? `:${coupon.expire}` : '';
const qrData = `COUPON:${coupon.title}:${coupon.discount}:${coupon.minPay}${expireStr}`;
// QRコードのサイズを小さめ（140x140）に変更
const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(qrData)}`;

document.getElementById("modal-title").innerText = coupon.title;
document.getElementById("modal-qr").innerHTML = `<img src="${qrUrl}" width="140" height="140" style="border-radius:6px;" crossorigin="anonymous">`;
document.getElementById("qr-modal").style.display = "flex";
}

function shareCouponImage() {
const captureArea = document.getElementById("qr-capture-area");

html2canvas(captureArea, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
canvas.toBlob(blob => {
const file = new File([blob], "coupon_qr.jpg", { type: "image/jpeg" });

if (navigator.canShare && navigator.canShare({ files: [file] })) {
navigator.share({
title: 'クーポンQRコード',
text: '11Pay用クーポンQRコードです',
files: [file]
}).catch(err => console.log('共有キャンセル'));
} else {
const link = document.createElement('a');
link.download = 'coupon_qr.jpg';
link.href = canvas.toDataURL('image/jpeg', 0.9);
link.click();
}
}, 'image/jpeg', 0.9);
});
}

function closeModal() {
document.getElementById("qr-modal").style.display = "none";
}

function saveAndRender() {
localStorage.setItem('maker_coupons', JSON.stringify(savedCoupons));
renderList();
}

function renderList() {
const listEl = document.getElementById("coupon-list");
if (savedCoupons.length === 0) {
listEl.innerHTML = '<div style="color:#999; font-size:13px; margin-top:15px;">作成されたクーポンはありません</div>';
return;
}

listEl.innerHTML = savedCoupons.map(c => `
<div class="coupon-item">
<div class="coupon-info">🎟️ ${c.title}</div>
<div class="coupon-detail">
${c.discount}円OFF (${c.minPay}円以上で利用可)
${c.expire ? `<br><span style="color:#e63946;">📅 期限: ${c.expire}まで</span>` : ''}
</div>
<div class="btn-group">
<button class="btn-sm btn-show" onclick="showQr(${c.id})">QRを表示</button>
<button class="btn-sm btn-del" onclick="deleteCoupon(${c.id})">削除</button>
</div>
</div>
`).join('');
}
</script>

</body>
</html>
